<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vehicle shipping details</title>
<style>
  :root {
    --ink: #16181c;
    --muted: #5b6371;
    --line: #d7dbe0;
    --paper: #ffffff;
    --accent: #1b4f5e;
    --accent-dark: #143c48;
    --danger: #9a2f22;
    --focus: rgba(47, 127, 150, .35);
  }

  *, *::before, *::after { box-sizing: border-box; }

  html { -webkit-text-size-adjust: 100%; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    font-size: 16px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  .page {
    max-width: 620px;
    margin: 0 auto;
    padding: 44px 22px 72px;
  }

  header {
    padding-bottom: 22px;
    margin-bottom: 30px;
    border-bottom: 1px solid var(--line);
  }

  .brand {
    display: block;
    width: 64px;
    height: 64px;
    margin: 0 0 22px;
  }

  h1 {
    margin: 0 0 10px;
    font-size: 1.65rem;
    line-height: 1.2;
    font-weight: 600;
    letter-spacing: -0.012em;
  }

  .lede {
    margin: 0;
    max-width: 46ch;
    color: var(--muted);
  }

  fieldset {
    margin: 0 0 30px;
    padding: 0;
    border: 0;
  }

  legend {
    margin: 0 0 14px;
    padding: 0;
    font-size: 0.95rem;
    font-weight: 600;
  }

  .field { margin-bottom: 20px; }
  .field:last-child { margin-bottom: 0; }

  label {
    display: block;
    margin-bottom: 6px;
    font-weight: 500;
  }

  .required {
    margin-left: 4px;
    color: var(--danger);
    font-weight: 400;
  }

  input, select {
    display: block;
    width: 100%;
    min-height: 48px;
    padding: 11px 13px;
    font: inherit;
    color: inherit;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 4px;
  }

  select { appearance: none; padding-right: 40px;
    background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%),
                      linear-gradient(135deg, var(--muted) 50%, transparent 50%);
    background-position: calc(100% - 20px) calc(50% + 2px), calc(100% - 14px) calc(50% + 2px);
    background-size: 6px 6px, 6px 6px;
    background-repeat: no-repeat;
  }

  #vin {
    font-size: 1.06rem;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    font-variant-numeric: tabular-nums;
  }

  input:focus-visible, select:focus-visible {
    outline: 3px solid var(--focus);
    outline-offset: 1px;
    border-color: var(--accent);
  }

  input:user-invalid, select:user-invalid { border-color: var(--danger); }

  .hint {
    display: block;
    margin-top: 6px;
    color: var(--muted);
    font-size: 0.86rem;
  }

  .pair {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 18px;
  }

  .actions { margin-top: 8px; }

  .vehicle {
    padding-top: 22px;
    margin-top: 22px;
    border-top: 1px solid var(--line);
  }

  #vehicles .vehicle:first-child {
    padding-top: 0;
    margin-top: 0;
    border-top: 0;
  }

  .vehicle-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 14px;
    margin-bottom: 16px;
  }

  .vehicle-title {
    margin: 0;
    font-size: 1rem;
    font-weight: 600;
  }

  .remove {
    width: auto;
    min-height: 0;
    padding: 2px 0;
    font-size: 0.875rem;
    font-weight: 400;
    color: var(--muted);
    background: none;
    border: 0;
    text-decoration: underline;
  }

  .remove:hover {
    color: var(--danger);
    background: none;
    border-color: transparent;
  }

  .secondary {
    width: 100%;
    min-height: 46px;
    margin-top: 22px;
    font-weight: 500;
    color: var(--accent);
    background: none;
    border: 1px dashed var(--line);
  }

  .secondary:hover {
    color: var(--accent-dark);
    background: #f4f6f7;
    border-color: var(--accent);
  }

  .secondary:disabled {
    cursor: not-allowed;
    opacity: .5;
  }

  .vins {
    display: flex;
    flex-wrap: wrap;
    gap: 6px 18px;
    margin: 0 0 22px;
    padding: 0;
    list-style: none;
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.06em;
    color: var(--ink);
  }

  button {
    width: 100%;
    min-height: 50px;
    padding: 13px 20px;
    font: inherit;
    font-weight: 600;
    color: #fff;
    background: var(--accent);
    border: 1px solid var(--accent);
    border-radius: 4px;
    cursor: pointer;
    transition: background-color .15s ease, border-color .15s ease;
  }

  button:hover { background: var(--accent-dark); border-color: var(--accent-dark); }
  button:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  button:disabled { cursor: progress; opacity: .75; }

  .message {
    margin: 18px 0 0;
    font-size: 0.95rem;
  }

  .message[data-tone="error"] { color: var(--danger); }

  .message .detail {
    display: block;
    margin-top: 4px;
    color: var(--muted);
    font-size: 0.86rem;
  }

  .done {
    padding: 26px 0 0;
    border-top: 1px solid var(--line);
  }

  .done h2 {
    margin: 0 0 10px;
    font-size: 1.25rem;
    font-weight: 600;
  }

  .done p { margin: 0 0 20px; color: var(--muted); max-width: 46ch; }

  .done strong {
    color: var(--ink);
    letter-spacing: 0.06em;
    font-variant-numeric: tabular-nums;
  }

  [hidden] { display: none !important; }

  @media (max-width: 480px) {
    .page { padding: 30px 18px 56px; }
    .pair { grid-template-columns: 1fr; gap: 0; }
    .pair .field { margin-bottom: 20px; }
  }

  @media (prefers-reduced-motion: reduce) {
    button { transition: none; }
  }
</style>
</head>

    <p class="lede">Tell us about the vehicles you're shipping. Add a block for each VIN, then send them all at once.</p>
  </header>

  <form id="vehicle-form" autocomplete="off">
    <fieldset>
      <legend>Your details</legend>

      <div class="field">
        <label for="company">Company / account name<span class="required" aria-hidden="true">*</span></label>
        <input id="company" name="company" type="text" required
               placeholder="e.g. Northline Autos" aria-describedby="company-hint">
        <span class="hint" id="company-hint">Remembered on this device, so your vehicles stay grouped under your account.</span>
      </div>
    </fieldset>

    <fieldset>
      <legend>Vehicles</legend>
      <div id="vehicles"></div>
      <button id="add-vehicle" class="secondary" type="button">Add another vehicle</button>
    </fieldset>

    <div class="actions">
      <button id="submit" type="submit">Send vehicle details</button>
    </div>
    <p class="message" id="message" role="status" aria-live="polite" hidden></p>
  </form>

  <section class="done" id="done" hidden aria-live="polite">
    <h2 tabindex="-1">Vehicles received</h2>
    <p id="done-summary"></p>
    <ul class="vins" id="done-vins"></ul>
    <button id="again" type="button">Add more vehicles</button>
  </section>

  <template id="vehicle-template">
    <section class="vehicle">
      <div class="vehicle-head">
        <h2 class="vehicle-title">Vehicle</h2>
        <button class="remove" type="button">Remove</button>
      </div>

      <div class="field">
        <label data-for="vin">VIN<span class="required" aria-hidden="true">*</span></label>
        <input data-field="vin" type="text" required maxlength="17" spellcheck="false"
               autocapitalize="characters" autocomplete="off" inputmode="text"
               placeholder="e.g. JTDBE32K630123456">
        <span class="hint" data-hint="vin">17 characters, shown on the windscreen or driver's door jamb.</span>
      </div>

      <div class="field">
        <label data-for="brand">Brand<span class="required" aria-hidden="true">*</span></label>
        <input data-field="brand" type="text" required placeholder="e.g. Toyota">
      </div>

      <div class="field">
        <label data-for="model">Model<span class="required" aria-hidden="true">*</span></label>
        <input data-field="model" type="text" required placeholder="e.g. Corolla">
      </div>

      <div class="field">
        <label data-for="engineType">Engine type<span class="required" aria-hidden="true">*</span></label>
        <select data-field="engineType" required>
          <option value="">Select engine type</option>
          <option>Petrol</option>
          <option>Diesel</option>
          <option>Hybrid</option>
          <option>Plug-in hybrid</option>
          <option>Electric</option>
          <option>LPG</option>
          <option>Other</option>
        </select>
      </div>

      <div class="pair">
        <div class="field">
          <label data-for="engineCapacity">Engine capacity<span class="required" aria-hidden="true">*</span></label>
          <input data-field="engineCapacity" type="text" required
                 placeholder="e.g. 1998 cc or 2.0 L">
        </div>

        <div class="field">
          <label data-for="year">Year of car make<span class="required" aria-hidden="true">*</span></label>
          <input data-field="year" type="number" required min="1900" max="2027"
                 step="1" inputmode="numeric" placeholder="e.g. 2019">
        </div>
      </div>
    </section>
  </template>
</main>

<script>
  // Paste your deployed Apps Script web app URL here (it ends in /exec).
  // Until this is filled in, the form will warn that it isn't connected.
  const ENDPOINT = "https://script.google.com/macros/s/AKfycbyk7V7wt7vjI934UiATcy9Do19ldJU1zq0dmeacSfwiMoV1NVZAsRDxoopeiTly9CKw/exec";

  const form = document.getElementById("vehicle-form");
  const submitButton = document.getElementById("submit");
  const addButton = document.getElementById("add-vehicle");
  const message = document.getElementById("message");
  const done = document.getElementById("done");
  const doneSummary = document.getElementById("done-summary");
  const doneVins = document.getElementById("done-vins");
  const companyInput = document.getElementById("company");
  const vehiclesEl = document.getElementById("vehicles");
  const vehicleTemplate = document.getElementById("vehicle-template");

  const MAX_VEHICLES = 50;
  const MAX_YEAR = new Date().getFullYear() + 1;

  // Anonymous customer ID, kept in this browser so every vehicle from the
  // same device is grouped under one customer in the spreadsheet.
  const CUSTOMER_ID_KEY = "vehicle-form:customer-id";
  const COMPANY_KEY = "vehicle-form:company";

  function readStored(key) {
    try { return localStorage.getItem(key); } catch (error) { return null; }
  }

  function writeStored(key, value) {
    try { localStorage.setItem(key, value); } catch (error) { /* storage blocked, not fatal */ }
  }

  function getCustomerId() {
    let id = readStored(CUSTOMER_ID_KEY);
    if (!id) {
      id = typeof crypto !== "undefined" && crypto.randomUUID
        ? crypto.randomUUID()
        : "c-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 10);
      writeStored(CUSTOMER_ID_KEY, id);
    }
    return id;
  }

  const customerId = getCustomerId();
  companyInput.value = readStored(COMPANY_KEY) || "";

  // Build one vehicle block from the template. Field ids use a running
  // counter, so removing a block can never leave two fields sharing an id.
  let blockSequence = 0;

  function addVehicle(focusVin) {
    if (vehiclesEl.children.length >= MAX_VEHICLES) return null;

    const block = vehicleTemplate.content.firstElementChild.cloneNode(true);
    const n = ++blockSequence;

    block.querySelectorAll("[data-field]").forEach((field) => {
      const name = field.dataset.field;
      const id = name + "-" + n;
      field.id = id;

      const label = block.querySelector('[data-for="' + name + '"]');
      if (label) label.htmlFor = id;

      const hint = block.querySelector('[data-hint="' + name + '"]');
      if (hint) {
        hint.id = name + "-hint-" + n;
        field.setAttribute("aria-describedby", hint.id);
      }

      if (name === "year") field.max = String(MAX_YEAR);
    });

    vehiclesEl.append(block);
    refresh();

    if (focusVin) block.querySelector('[data-field="vin"]').focus();
    return block;
  }

  function refresh() {
    const blocks = Array.from(vehiclesEl.children);

    blocks.forEach((block, index) => {
      block.querySelector(".vehicle-title").textContent = "Vehicle " + (index + 1);
      const remove = block.querySelector(".remove");
      remove.hidden = blocks.length === 1;
      remove.setAttribute("aria-label", "Remove vehicle " + (index + 1));
    });

    submitButton.textContent = blocks.length === 1
      ? "Send vehicle details"
      : "Send " + blocks.length + " vehicles";
    addButton.disabled = blocks.length >= MAX_VEHICLES;
  }

  vehiclesEl.addEventListener("input", (event) => {
    const field = event.target;
    if (field.dataset.field !== "vin") return;
    const start = field.selectionStart;
    field.value = field.value.toUpperCase();
    field.setSelectionRange(start, start);
  });

  vehiclesEl.addEventListener("click", (event) => {
    const remove = event.target.closest(".remove");
    if (!remove || vehiclesEl.children.length === 1) return;
    remove.closest(".vehicle").remove();
    refresh();
  });

  addButton.addEventListener("click", () => addVehicle(true));

  function showMessage(text, tone, detail) {
    message.textContent = text;
    message.dataset.tone = tone;
    if (detail) {
      const span = document.createElement("span");
      span.className = "detail";
      span.textContent = detail;
      message.append(span);
    }
    message.hidden = false;
  }

  function clearMessage() {
    message.hidden = true;
    message.textContent = "";
    delete message.dataset.tone;
  }

  function readVehicles() {
    return Array.from(vehiclesEl.children).map((block) => {
      const value = (name) => block.querySelector('[data-field="' + name + '"]').value.trim();
      return {
        vin: value("vin").toUpperCase(),
        brand: value("brand"),
        model: value("model"),
        engineType: block.querySelector('[data-field="engineType"]').value,
        engineCapacity: value("engineCapacity"),
        year: value("year")
      };
    });
  }

  form.addEventListener("submit", async (event) => {
    event.preventDefault();
    clearMessage();

    if (!form.reportValidity()) return;

    if (!ENDPOINT) {
      showMessage("This form isn't connected yet.", "error",
        "Add your Apps Script web app URL to the ENDPOINT value in this file.");
      return;
    }

    const vehicles = readVehicles();
    const company = companyInput.value.trim();
    const data = { customerId: customerId, company: company, vehicles: vehicles };

    submitButton.disabled = true;
    addButton.disabled = true;
    submitButton.textContent = "Sending…";

    try {
      const response = await fetch(ENDPOINT, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(data)
      });

      const result = await response.json().catch(() => null);

      if (!response.ok || !result || result.ok !== true) {
        throw new Error(result && result.error ? result.error : "The server rejected the submission.");
      }

      writeStored(COMPANY_KEY, company);

      doneSummary.textContent = vehicles.length === 1
        ? "We've recorded this vehicle for " + company + "."
        : "We've recorded " + vehicles.length + " vehicles for " + company + ".";
      doneVins.replaceChildren(...vehicles.map((vehicle) => {
        const item = document.createElement("li");
        item.textContent = vehicle.vin;
        return item;
      }));

      form.hidden = true;
      done.hidden = false;
      done.querySelector("h2").focus();
    } catch (error) {
      showMessage("We couldn't send these details. Please try again.", "error", error.message);
    } finally {
      submitButton.disabled = false;
      refresh();
    }
  });

  document.getElementById("again").addEventListener("click", () => {
    form.reset();
    vehiclesEl.replaceChildren();
    addVehicle(false);
    companyInput.value = readStored(COMPANY_KEY) || "";
    done.hidden = true;
    form.hidden = false;
    clearMessage();
    vehiclesEl.querySelector('[data-field="vin"]').focus();
  });

  addVehicle(false);
</script>
</body>
